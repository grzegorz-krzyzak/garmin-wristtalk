<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30">
  <!-- The watch's complication icon is 30 x 30 px (the device's compiler.json): the edges on whole
       pixels, the outline a dark bar 1 px larger than the white one (a stroke falls between pixels).
       The phone draws it as a white silhouette, the outline shows on the watch. -->
  <g fill="#000000">
    <rect x="3" y="9" width="6" height="12" rx="2"/>
    <rect x="12" y="2" width="6" height="26" rx="2"/>
    <rect x="21" y="6" width="6" height="18" rx="2"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="4" y="10" width="4" height="10" rx="1"/>
    <rect x="13" y="3" width="4" height="24" rx="1"/>
    <rect x="22" y="7" width="4" height="16" rx="1"/>
  </g>
</svg>
